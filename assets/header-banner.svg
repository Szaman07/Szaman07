<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <defs>
    <!-- Glow filters for magical elements -->
    <filter id="rupeeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="triGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.2"/>
    </filter>

    <filter id="pathShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050e09"/>
      <stop offset="100%" stop-color="#0a1c12"/>
    </linearGradient>
    
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#14301d"/>
    </linearGradient>

    <!-- Detailed Pixel Leaf Cluster (kept for borders) -->
    <g id="leafCluster">
      <rect x="0" y="0" width="10" height="10" fill="#184a28"/>
      <rect x="6" y="-6" width="12" height="12" fill="#206634"/>
      <rect x="-6" y="4" width="10" height="10" fill="#143820"/>
      <rect x="12" y="4" width="8" height="8" fill="#298242"/>
      <rect x="4" y="8" width="8" height="8" fill="#1a522c"/>
    </g>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1000" height="380" fill="url(#skyGrad)"/>

  <!-- ==================== SMOOTH ATMOSPHERIC FOREST BACKGROUND ==================== -->
  <!-- Layer 1 (Farthest, dark, soft silhouettes) -->
  <path d="M0,280 Q150,220 300,260 T600,240 T850,270 T1000,230 L1000,380 L0,380 Z" fill="#07150c"/>
  
  <!-- Layer 2 (Mid-distance rolling tree canopies) -->
  <path d="M0,300 C120,250 200,310 350,270 S550,300 650,260 S850,320 1000,280 L1000,380 L0,380 Z" fill="#091c11"/>
  
  <!-- Layer 3 (Closer dark forest edges) -->
  <path d="M0,330 C80,280 150,340 250,290 S400,350 450,380 L0,380 Z" fill="#0b2416"/>
  <path d="M1000,330 C920,280 850,340 750,290 S600,350 550,380 L1000,380 Z" fill="#0b2416"/>
  
  <!-- Layer 4 (Immediate foreground dark silhouettes to frame the scene) -->
  <path d="M0,380 C50,310 100,380 150,380 Z" fill="#0d2b1a"/>
  <path d="M1000,380 C950,310 900,380 850,380 Z" fill="#0d2b1a"/>

  <!-- ==================== DISTANT CASTLE ==================== -->
  <!-- Shifted slightly up so it sits naturally in the hills -->
  <g transform="translate(500, 235)" fill="#06120b">
    <!-- Main building -->
    <rect x="-40" y="-30" width="80" height="30"/>
    <!-- Central Tower -->
    <rect x="-15" y="-60" width="30" height="60"/>
    <polygon points="-20,-60 0,-90 20,-60"/>
    <!-- Side Towers -->
    <rect x="-50" y="-45" width="20" height="45"/>
    <polygon points="-55,-45 -40,-70 -25,-45"/>
    <rect x="30" y="-45" width="20" height="45"/>
    <polygon points="25,-45 40,-70 55,-45"/>
    <!-- Gate -->
    <rect x="-8" y="-20" width="16" height="20" fill="#040a06" rx="8"/> 
    <!-- Distant glowing windows -->
    <rect x="-4" y="-50" width="3" height="8" fill="#D4AF37" opacity="0.3"/>
    <rect x="2" y="-50" width="3" height="8" fill="#D4AF37" opacity="0.3"/>
  </g>

  <!-- ==================== THE PATH ==================== -->
  <polygon points="460,235 540,235 650,380 350,380" fill="url(#pathGrad)"/>
  
  <!-- Path stone details / perspective lines -->
  <path d="M470,250 L530,250 M455,275 L545,275 M435,305 L565,305 M400,340 L600,340" stroke="#08140c" stroke-width="2" opacity="0.5"/>
  <path d="M500,235 L500,380 M485,235 L420,380 M515,235 L580,380" stroke="#08140c" stroke-width="2" opacity="0.4"/>

  <!-- Grass details along the path -->
  <path d="M340,370 Q360,360 380,380 M360,350 Q380,340 400,360 M400,320 Q410,310 430,330" fill="none" stroke="#0d2b1a" stroke-width="3"/>
  <path d="M660,370 Q640,360 620,380 M640,350 Q620,340 600,360 M600,320 Q590,310 570,330" fill="none" stroke="#0d2b1a" stroke-width="3"/>

  <!-- ==================== GLOWING ATMOSPHERIC PARTICLES ==================== -->
  <circle cx="200" cy="280" r="2" fill="#78C27A" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="0s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="250" r="1.5" fill="#A7F432" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="320" r="2" fill="#D4AF37" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="300" r="1.5" fill="#78C27A" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== ORNATE GOLD BORDER & VINES ==================== -->
  <!-- Main outer frame -->
  <rect x="12" y="12" width="976" height="356" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.8"/>
  <!-- Inner frame -->
  <rect x="22" y="22" width="956" height="336" fill="none" stroke="#8B7225" stroke-width="1.5" opacity="0.6"/>

  <!-- Decorative Corner Elements -->
  <!-- Top Left -->
  <path d="M12,40 L30,40 L30,30 L40,30 L40,12" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="26,26 34,18 42,26 34,34" fill="#D4AF37"/>
  <!-- Top Right -->
  <path d="M988,40 L970,40 L970,30 L960,30 L960,12" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="974,26 966,18 958,26 966,34" fill="#D4AF37"/>
  <!-- Bottom Left -->
  <path d="M12,340 L30,340 L30,350 L40,350 L40,368" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="26,354 34,362 42,354 34,346" fill="#D4AF37"/>
  <!-- Bottom Right -->
  <path d="M988,340 L970,340 L970,350 L960,350 L960,368" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="974,354 966,362 958,354 966,346" fill="#D4AF37"/>

  <!-- Pixel Vines wrapping the borders -->
  <use href="#leafCluster" x="8" y="45"/>
  <use href="#leafCluster" x="25" y="8"/>
  <use href="#leafCluster" x="18" y="70" transform="scale(0.8)"/>
  <use href="#leafCluster" x="65" y="15" transform="scale(0.9)"/>
  
  <use href="#leafCluster" x="975" y="45"/>
  <use href="#leafCluster" x="955" y="8"/>
  <use href="#leafCluster" x="978" y="70" transform="scale(0.8)"/>
  <use href="#leafCluster" x="925" y="15" transform="scale(0.9)"/>
  
  <use href="#leafCluster" x="8" y="325"/>
  <use href="#leafCluster" x="25" y="355"/>
  <use href="#leafCluster" x="18" y="290" transform="scale(0.8)"/>
  <use href="#leafCluster" x="75" y="360" transform="scale(0.9)"/>
  
  <use href="#leafCluster" x="975" y="325"/>
  <use href="#leafCluster" x="955" y="355"/>
  <use href="#leafCluster" x="978" y="290" transform="scale(0.8)"/>
  <use href="#leafCluster" x="915" y="360" transform="scale(0.9)"/>

  <!-- ==================== TRIFORCE (Moved up and scaled slightly smaller) ==================== -->
  <g filter="url(#triGlow)" transform="translate(500, 38) scale(1.1)">
    <!-- Top triangle -->
    <polygon points="0,-18 14,6 -14,6" fill="#D4AF37"/>
    <!-- Bottom-left triangle -->
    <polygon points="-16,8 -2,32 -30,32" fill="#D4AF37"/>
    <!-- Bottom-right triangle -->
    <polygon points="16,8 30,32 2,32" fill="#D4AF37"/>
    <!-- Inner highlights -->
    <polygon points="0,-12 8,2 -8,2" fill="#FFF1B8" opacity="0.5"/>
    <polygon points="-16,14 -6,28 -26,28" fill="#FFF1B8" opacity="0.5"/>
    <polygon points="16,14 26,28 6,28" fill="#FFF1B8" opacity="0.5"/>
  </g>

  <!-- ==================== MAIN TITLE TEXT ==================== -->
  <!-- Scaled down from 78 to 64 and positioned lower to avoid overlap -->
  <g filter="url(#textGlow)">
    <text x="500" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#EADCA6" letter-spacing="8">
      SADMAN ZAMAN
    </text>
  </g>

  <!-- Subtitle -->
  <text x="500" y="170" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" fill="#8ca893" letter-spacing="4" font-weight="700">
    CS UNDERGRADUATE · SYSTEMS · AI · RESEARCH
  </text>

  <!-- ==================== CENTER RUPEE & DECORATION ==================== -->
  <line x1="300" y1="210" x2="450" y2="210" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
  <polygon points="290,210 298,205 306,210 298,215" fill="#D4AF37"/>
  <circle cx="435" cy="210" r="3" fill="#D4AF37"/>
  
  <line x1="550" y1="210" x2="700" y2="210" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
  <polygon points="710,210 702,205 694,210 702,215" fill="#D4AF37"/>
  <circle cx="565" cy="210" r="3" fill="#D4AF37"/>

  <!-- The Floating Green Rupee -->
  <g filter="url(#rupeeGlow)" transform="translate(500, 210) scale(1.2)">
    <polygon points="0,-24 16,-8 16,8 0,24 -16,8 -16,-8" fill="#78C27A" stroke="#A7F432" stroke-width="1">
      <animate attributeName="fill" values="#78C27A;#8BD68D;#A7F432;#8BD68D;#78C27A" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-16 8,-4 8,4 0,16 -8,4 -8,-4" fill="#A7F432" opacity="0.4"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <line x1="-16" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <animateTransform attributeName="transform" type="translate" values="500,210; 500,203; 500,210" dur="3s" repeatCount="indefinite"/>
  </g>

</svg>
