<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <!-- Zelda Themed Gradient -->
    <linearGradient id="zeldaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50">
        <animate attributeName="stop-color" values="#4CAF50;#FFD700;#8BC34A;#4CAF50" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8BC34A;#4CAF50;#FFD700" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8BC34A">
        <animate attributeName="stop-color" values="#8BC34A;#4CAF50;#FFD700;#8BC34A" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Text Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4CAF50" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Accent Line Top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#zeldaGradient)"/>
  
  <!-- Main Name Text -->
  <g filter="url(#textShadow)">
    <text x="450" y="85" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#FFD700" letter-spacing="5">
      SADMAN ZAMAN
    </text>
  </g>
  
  <!-- Decorative Lines -->
  <g opacity="0.6">
    <line x1="120" y1="145" x2="380" y2="145" stroke="url(#zeldaGradient)" stroke-width="2">
      <animate attributeName="x2" values="120;380" dur="1s" fill="freeze"/>
    </line>
    <line x1="520" y1="145" x2="780" y2="145" stroke="url(#zeldaGradient)" stroke-width="2">
      <animate attributeName="x1" values="780;520" dur="1s" fill="freeze"/>
    </line>
  </g>
  
  <!-- Green Rupee -->
  <g transform="translate(450, 145)">
    <polygon points="0,-18 12,-8 12,8 0,18 -12,8 -12,-8" fill="#4CAF50" stroke="#FFD700" stroke-width="1.5">
      <animate attributeName="fill" values="#4CAF50;#8BC34A;#4CAF50" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Accent Line Bottom -->
  <rect x="0" y="177" width="900" height="3" fill="url(#zeldaGradient)"/>
</svg>
