<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16">
  <defs>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#07110B"/>
      <stop offset="10%" style="stop-color:#D4AF37" stop-opacity="0.3"/>
      <stop offset="40%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="60%" style="stop-color:#D4AF37"/>
      <stop offset="90%" style="stop-color:#D4AF37" stop-opacity="0.3"/>
