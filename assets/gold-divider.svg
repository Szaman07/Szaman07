  <polygon points="450,4 454,8 450,12 446,8" fill="#A7F432" opacity="0.4"/>
  
  <!-- Small decorative dots -->
  <circle cx="420" cy="8" r="1.5" fill="#D4AF37" opacity="0.5"/>
  <circle cx="480" cy="8" r="1.5" fill="#D4AF37" opacity="0.5"/>
  <circle cx="400" cy="8" r="1" fill="#D4AF37" opacity="0.3"/>
  <circle cx="500" cy="8" r="1" fill="#D4AF37" opacity="0.3"/>
